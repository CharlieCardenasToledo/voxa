name: Reporte de error
description: Reporta algo que no funciona como se espera en Voxa.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un error. Si es una vulnerabilidad de seguridad, no uses este formulario — sigue el proceso descrito en [SECURITY.md](https://github.com/CharlieCardenasToledo/voxa/blob/master/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: ¿Qué pasó?
      description: Describe el comportamiento observado y el que esperabas.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Pasos numerados para reproducir el problema de forma consistente.
      placeholder: |
        1. Abre Voxa y prepara una sesión en modo...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Voxa
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Mensajes de error o capturas relevantes
      description: Pega aquí cualquier mensaje que haya mostrado Voxa (evita incluir tu clave de Gemini o datos personales de tus sesiones).
      render: shell
