[package]
name = "voxa"
version = "0.1.0"
description = "Private presentation copilot for Windows"
authors = ["Voxa"]
edition = "2021"

[lib]
name = "voxa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", features = ["windows-native"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
cpal = "0.15.3"
base64 = "0.22"
lopdf = "0.41"
zip = "4.6.1"
quick-xml = "0.41"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
